<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imagetest</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>imagetest</h1>
      <p>上传产品图片 → AI 自动识别类型 → 生成完整亚马逊图集</p>
    </div>
  </header>

  <main>
    <!-- ── Step 0: API Key ── -->
    <section id="apikey-section" class="card">
      <h2>① 输入 Google API Key</h2>
      <p class="hint">
        Key 仅在本次会话中使用，不会上传或存储到服务器。
        前往 <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> 免费获取。
      </p>
      <div class="apikey-row">
        <input
          id="apikey-input"
          type="password"
          placeholder="AIza..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="apikey-toggle" class="btn btn-secondary" type="button">显示</button>
        <button id="apikey-save" class="btn btn-primary" type="button">确认</button>
        <button id="apikey-clear" class="btn btn-secondary" type="button" title="清除本地保存的 Key">清除</button>
      </div>
      <p id="apikey-status" class="apikey-status hidden"></p>

      <!-- Model selector -->
      <div id="model-row" class="model-row hidden">
        <label class="model-label" for="model-select">识别模型</label>
        <select id="model-select" class="model-select"></select>
        <button id="model-refresh" class="btn btn-secondary btn-sm" type="button" title="重新获取模型列表">↻</button>
        <span id="model-status" class="model-status"></span>
      </div>
    </section>

    <!-- ── Step 1: Upload ── -->
    <section id="upload-section" class="card locked">
      <h2>② 上传产品图片</h2>
      <p class="hint">支持 JPG / PNG / WEBP，可多张上传（建议 3–8 张不同角度）</p>

      <div id="drop-zone" class="drop-zone">
        <div class="drop-icon">📷</div>
        <p>拖拽图片到此处，或点击下方按钮选择</p>
        <label for="file-input" class="btn btn-secondary" style="margin-top:10px;display:inline-flex;">选择文件</label>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
      </div>

      <div id="preview-grid" class="preview-grid hidden"></div>

      <button id="analyze-btn" class="btn btn-primary" disabled>
        开始识别
      </button>
    </section>

    <!-- ── Step 2: Detection result ── -->
    <section id="detection-section" class="card hidden">
      <h2>③ 识别结果</h2>
      <div id="detection-result" class="detection-result"></div>
      <div class="detection-actions">
        <button id="generate-btn" class="btn btn-primary">生成图集</button>
        <button id="reupload-btn" class="btn btn-secondary">重新上传</button>
      </div>
    </section>

    <!-- ── Step 3: Generation progress ── -->
    <section id="progress-section" class="card hidden">
      <h2>④ 生成中</h2>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-label" class="progress-label">准备中…</p>
      <div id="live-grid" class="result-grid"></div>
    </section>

    <!-- ── Step 4: Results ── -->
    <section id="results-section" class="card hidden">
      <h2>⑤ 完成</h2>
      <div class="results-header">
        <span id="results-count"></span>
        <button id="download-btn" class="btn btn-primary">下载全部 ZIP</button>
      </div>
      <div id="tab-bar" class="tab-bar"></div>
      <div id="result-grid" class="result-grid"></div>
    </section>
  </main>

    <!-- ── Error Log ── -->
    <section id="log-section" class="card hidden">
      <div class="log-header">
        <h2>错误日志</h2>
        <button id="log-clear-btn" class="btn btn-secondary">清空</button>
      </div>
      <div id="log-list"></div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
